# CI for the ibetitsmike/coder fork. Upstream's workflows stay disabled in the
# fork. See coderd/database/migrations/chatdmig/README.md.
name: fork-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate the chatd graph
        run: go run ./coderd/database/migrations/chatdmig/cmd/chatdmig check
      - name: Unit tests
        run: go test -count=1 ./coderd/database/migrations/chatdmig/...
      - name: Check API key scopes
        run: go run ./scripts/check-scopes

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CHATDMIG_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Postgres
        run: ./.github/fork/start-postgres.sh
      # pg_dump refuses a server newer than itself.
      - name: Check pg_dump
        run: |
          pg_dump --version
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -n1)" -ge 16
      - name: Schema and runner tests
        run: go test -count=1 -v ./coderd/database/migrations/chatdmig/

  chat-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # dbtestutil uses postgres:postgres@127.0.0.1:5432 when it answers.
      - name: Start Postgres
        run: ./.github/fork/start-postgres.sh
      - name: Chat and database packages
        run: go test -count=1 ./coderd/x/... ./coderd/database/... ./enterprise/dbcrypt/...
      - name: Chat API tests
        run: go test -count=1 -run '(?i)chat|skill|mcp|plugin' ./coderd ./enterprise/coderd
      - name: Plugin CLI tests
        run: go test -count=1 -run TestExpPlugins ./cli
      - name: Swagger annotation tests
        run: go test -count=1 -run 'EndpointsDocumented|TestSwagger' ./coderd/coderdtest ./enterprise/coderd/coderdenttest
      - name: Check API docs for drift
        run: ./.github/fork/check-apidoc.sh

  agent-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Agent context, agent git and SDK packages
        run: go test -count=1 ./agent/agentcontext/... ./agent/agentgit/... ./codersdk/

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          install-args: "node pnpm"
      - name: Install pnpm dependencies
        uses: ./.github/actions/pnpm-install
      - name: Type check
        run: pnpm run lint:types
        working-directory: site
      - name: Agents page unit tests
        run: pnpm test:ci src/pages/AgentsPage
        working-directory: site

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build coder
        run: go build -o /dev/null ./enterprise/cmd/coder

  forkdb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # mise.toml pins the coder sqlc fork that upstream generates with.
      - name: Install sqlc
        run: |
          version=$(sed -n '/^\[tools\."go:github.com\/coder\/sqlc\/cmd\/sqlc"\]/,/^version/s/^version = "\(.*\)"/\1/p' mise.toml)
          test -n "$version"
          CGO_ENABLED=1 go install "github.com/coder/sqlc/cmd/sqlc@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate fork queries
        run: ./coderd/database/forkdb/generate.sh
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- coderd/database/forkdb)" ]; then
            echo "forkdb is out of date. Run ./coderd/database/forkdb/generate.sh and commit the result."
            git status --porcelain -- coderd/database/forkdb
            git diff -- coderd/database/forkdb
            exit 1
          fi
