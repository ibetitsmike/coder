# CI for the ibetitsmike/coder fork. Upstream's workflows stay disabled in the
# fork. See coderd/database/migrations/chatdmig/README.md.
name: fork-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate the chatd graph
        run: go run ./coderd/database/migrations/chatdmig/cmd/chatdmig check
      - name: Unit tests
        run: go test -count=1 ./coderd/database/migrations/chatdmig/...
      - name: Check API key scopes
        run: go run ./scripts/check-scopes

  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CHATDMIG_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Postgres
        run: ./.github/fork/start-postgres.sh
      # pg_dump refuses a server newer than itself.
      - name: Check pg_dump
        run: |
          pg_dump --version
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -n1)" -ge 16
      - name: Schema and runner tests
        run: go test -count=1 -v ./coderd/database/migrations/chatdmig/

  chat-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # dbtestutil uses postgres:postgres@127.0.0.1:5432 when it answers.
      - name: Start Postgres
        run: ./.github/fork/start-postgres.sh
      - name: Chat and database packages
        run: go test -count=1 ./coderd/x/... ./coderd/database/... ./enterprise/dbcrypt/...
      - name: Chat API tests
        run: go test -count=1 -run '(?i)chat|skill|mcp|plugin' ./coderd ./enterprise/coderd
      - name: Plugin CLI tests
        run: go test -count=1 -run TestExpPlugins ./cli
      - name: Swagger annotation tests
        run: go test -count=1 -run 'EndpointsDocumented|TestSwagger' ./coderd/coderdtest ./enterprise/coderd/coderdenttest
      - name: Check API docs for drift
        run: ./.github/fork/check-apidoc.sh

  agent-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Agent context, agent git and SDK packages
        run: go test -count=1 ./agent/agentcontext/... ./agent/agentgit/... ./codersdk/

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          install-args: "node pnpm"
      - name: Install pnpm dependencies
        uses: ./.github/actions/pnpm-install
      - name: Type check
        run: pnpm run lint:types
        working-directory: site
      - name: Agents page unit tests
        run: pnpm test:ci src/pages/AgentsPage
        working-directory: site

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build coder
        run: go build -o /dev/null ./enterprise/cmd/coder

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests check out the merge commit; its first parent is the
          # base branch tip that the lint step compares against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # mise.toml pins the golangci-lint version that upstream lints with.
      - name: Install golangci-lint
        run: |
          version=$(sed -n 's/^"go:github\.com\/golangci\/golangci-lint\/v2\/cmd\/golangci-lint" = "\(.*\)"$/\1/p' mise.toml)
          test -n "$version"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          dir=$("$(go env GOPATH)/bin/golangci-lint" cache status | awk '/Dir/ { print $2 }')
          echo "LINT_CACHE_DIR=$dir" >> "$GITHUB_ENV"
      # Only pushes to main save the cache, so pull requests cannot poison it.
      - name: Restore golangci-lint cache
        id: golangci-lint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LINT_CACHE_DIR }}
          key: fork-golangci-lint-${{ runner.os }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            fork-golangci-lint-${{ runner.os }}-
      # Lints the packages that hold fork code and reports only issues on
      # lines a pull request changes, so findings it did not introduce never
      # block it. Other events compare HEAD with itself and report nothing.
      - name: golangci-lint
        env:
          NEW_FROM: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: |
          mapfile -t fork_pkgs < <(git ls-files -- '*fork_*.go' '*/fork.go' | xargs -n1 dirname | sort -u | sed 's|^|./|')
          golangci-lint run --fix=false --new-from-merge-base="$NEW_FROM" \
            "${fork_pkgs[@]}" \
            ./coderd/x/... \
            ./coderd/database/forkdb/... \
            ./coderd/database/migrations/chatdmig/... \
            ./codersdk/x/... \
            ./examples/plugins/...
      - name: Save golangci-lint cache
        if: github.ref == 'refs/heads/main' && steps.golangci-lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LINT_CACHE_DIR }}
          key: ${{ steps.golangci-lint-cache.outputs.cache-primary-key }}

  forkdb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # mise.toml pins the coder sqlc fork that upstream generates with.
      - name: Install sqlc
        run: |
          version=$(sed -n '/^\[tools\."go:github.com\/coder\/sqlc\/cmd\/sqlc"\]/,/^version/s/^version = "\(.*\)"/\1/p' mise.toml)
          test -n "$version"
          CGO_ENABLED=1 go install "github.com/coder/sqlc/cmd/sqlc@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate fork queries
        run: ./coderd/database/forkdb/generate.sh
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- coderd/database/forkdb)" ]; then
            echo "forkdb is out of date. Run ./coderd/database/forkdb/generate.sh and commit the result."
            git status --porcelain -- coderd/database/forkdb
            git diff -- coderd/database/forkdb
            exit 1
          fi
