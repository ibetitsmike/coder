syntax = "proto3";
option go_package = "github.com/coder/coder/v2/coderd/x/plugins/pluginhost/proto";

package coder.pluginhost.v1;

import "codersdk/x/pluginsdk/pluginproto/plugin.proto";

// PluginHost runs one Wasm plugin inside the coder plugin-host child
// process. coderd is the client.
service PluginHost {
  // Load compiles and instantiates a module, replacing any previously
  // loaded module.
  rpc Load(LoadRequest) returns (LoadResponse);
  // Invoke runs one export. The client sends start, then answers every
  // host_call with a host_result until the server sends done.
  rpc Invoke(stream InvokeMessage) returns (stream InvokeMessage);
}

message Limits {
  uint32 memory_pages = 1;
  int64 call_timeout_ms = 2;
  uint32 max_input_bytes = 3;
  uint32 max_output_bytes = 4;
  int64 max_log_bytes = 5;
}

message LoadRequest {
  bytes wasm = 1;
  Limits limits = 2;
}

message LoadResponse {
  coder.plugins.v1.Manifest manifest = 1;
}

message InvokeStart {
  string export = 1;
  bytes input = 2;
}

message InvokeDone {
  bytes output = 1;
  string error = 2;
}

message InvokeMessage {
  oneof msg {
    InvokeStart start = 1;
    coder.plugins.v1.HostCall host_call = 2;
    coder.plugins.v1.HostResult host_result = 3;
    InvokeDone done = 4;
  }
}
