# sqlc config of the fork's queries. See
# ../migrations/chatdmig/README.md#fork-queries.
#
# The schema is upstream's dump.sql, then every fork node in graph order.
# TestSQLCSchemaOrder fails when this list and the graph disagree.
version: "2"
sql:
  - schema:
      - "../dump.sql"
      - "../migrations/chatdmig/nodes/01a1b58c-24fa-7d7d-91d6-202388cf7cc8_adopt_chatd_schema.up.sql"
      - "../migrations/chatdmig/nodes/01a1bc7b-6e0c-783d-8945-1c634ab35eea_plugins.up.sql"
      - "../migrations/chatdmig/nodes/01a1bd31-6117-7cbd-bb14-1a8ca7a596b3_chat_subagents.up.sql"
      - "../migrations/chatdmig/nodes/01a1bf18-8dc8-7144-9910-57281bd260fb_chat_todos.up.sql"
      - "../migrations/chatdmig/nodes/01a1bfc4-13ba-78b6-8668-4cc368ed96cc_chat_organization_subagent_limits.up.sql"
      - "../migrations/chatdmig/nodes/01a1c08d-32ae-7003-94bf-3e43983154d7_chat_subagent_tool_policy.up.sql"
      - "../migrations/chatdmig/nodes/01a1c18d-027a-7d4a-a2ad-e823d1e3ca6c_agent_definitions.up.sql"
      - "../migrations/chatdmig/nodes/01a1c242-decb-7db2-b52e-38c2843c434c_agent_definition_acl_org_member_delete.up.sql"
      - "../migrations/chatdmig/nodes/01a1c246-5dca-70a7-a0f9-63c3d58c0a60_agent_definition_project_organization.up.sql"
      - "../migrations/chatdmig/nodes/01a1c256-cefe-797e-8c6a-1c0558040659_chat_descendant_questions.up.sql"
      - "../migrations/chatdmig/nodes/01a1c28c-8c16-78c2-af7b-26d1d9f7986e_chat_wakeups.up.sql"
      - "../migrations/chatdmig/nodes/01a1c445-c921-7a71-bdea-b2dc23c749b9_chat_secret_answers.up.sql"
      - "../migrations/chatdmig/nodes/01a1ca6a-c967-7052-ab8d-4298f2746e05_dedup_plugin_link_active_chats.up.sql"
      - "../migrations/chatdmig/nodes/01a1caef-7d98-7266-bb1b-1b72cfc1883c_plugin_chat_binding_delivered.up.sql"
      - "../migrations/chatdmig/nodes/01a1cb11-79e0-7209-811f-6789c162db26_plugin_packs.up.sql"
      - "../migrations/chatdmig/nodes/01a1cb1c-5809-7422-aefd-a4ced9de57ba_plugin_pack_sources.up.sql"
      - "../migrations/chatdmig/nodes/01a1cb68-bbe7-7a46-a263-7aafc35993cc_plugin_pack_enablement.up.sql"
      - "../migrations/chatdmig/nodes/01a1cc2d-5c38-7321-a2e0-3c283011ffa1_chat_organization_wakeup_caps.up.sql"
      - "../migrations/chatdmig/nodes/01a1cea4-904d-7fef-952d-1378c5d85552_chat_pinned_skills.up.sql"
      - "../migrations/chatdmig/nodes/01a1cf83-8e87-75d6-aa9f-332c882b6ac8_chat_excluded_plugin_packs.up.sql"
      - "../migrations/chatdmig/nodes/01a1d041-1628-77af-9c39-d4e3e711e0d3_workflow_journal.up.sql"
      - "../migrations/chatdmig/nodes/01a1d05b-a4aa-7050-ac85-2f3c1e806fe9_workflow_run_timestamps.up.sql"
    queries: "./queries"
    engine: "postgresql"
    gen:
      go:
        package: "forkdb"
        out: "."
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        # Emit only the models of fork queries, not one per upstream table.
        omit_unused_structs: true
        initialisms:
          - id
          - ai
          - nats
        # Upstream types that fork queries use come from package database.
        overrides:
          - db_type: "chat_status"
            go_type:
              import: "github.com/coder/coder/v2/coderd/database"
              type: "ChatStatus"
          - db_type: "chat_status"
            nullable: true
            go_type:
              import: "github.com/coder/coder/v2/coderd/database"
              type: "NullChatStatus"
          - column: "agent_definitions.group_acl"
            go_type:
              import: "github.com/coder/coder/v2/coderd/database"
              type: "ChatACL"
          - column: "agent_definitions.user_acl"
            go_type:
              import: "github.com/coder/coder/v2/coderd/database"
              type: "ChatACL"
          # jsonb params: a plain json.RawMessage reaches pq as a zero-length
          # []byte even when nil, which Postgres rejects as invalid JSON on
          # nullable jsonb columns. NullRawMessage sends a real NULL.
          - column: "workflow_steps.value"
            go_type:
              import: "github.com/sqlc-dev/pqtype"
              type: "NullRawMessage"
          - column: "workflow_runs.result"
            go_type:
              import: "github.com/sqlc-dev/pqtype"
              type: "NullRawMessage"
